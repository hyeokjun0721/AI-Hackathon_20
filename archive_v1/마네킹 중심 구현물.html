<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 체형 슬라이더</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fa;--panel:#ffffff;--text:#1d2430;--muted:#6b7487;--accent:#3b6fd8;--line:#dfe4ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181f;--panel:#1e232d;--text:#e8ecf3;--muted:#98a2b3;--accent:#6d96f0;--line:#2d3440}}
:root[data-theme="dark"]{--bg:#15181f;--panel:#1e232d;--text:#e8ecf3;--muted:#98a2b3;--accent:#6d96f0;--line:#2d3440}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{display:flex;flex-direction:column;height:100%;max-width:1000px;margin:0 auto}
#view{flex:1;min-height:340px;position:relative;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
#view canvas{display:block;width:100%;height:100%}
.panel{background:var(--panel);border-top:1px solid var(--line);padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px))}
h1{font-size:16px;margin:0 0 6px}
.note{font-size:12px;color:var(--muted);margin:0 0 8px}
.row{display:grid;grid-template-columns:52px 1fr 80px;align-items:center;gap:10px;margin:8px 0}
.row label{font-size:14px}
.row output{font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.check{font-size:14px;display:flex;gap:6px;align-items:center}
@media (min-width:720px){
  .wrap{flex-direction:row}
  #view{flex:1 1 60%;min-height:0}
  .panel{flex:0 0 300px;border-top:none;border-left:1px solid var(--line);overflow:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="view"></div>
  <div class="panel">
    <h1>체형 슬라이더</h1>
    <p class="note">단순 도형으로 만든 모델입니다. 실제 신체 치수와 다를 수 있어요.</p>

    <div class="row">
      <label for="h">키</label>
      <input id="h" type="range" min="150" max="200" step="1" value="170">
      <output id="hO"></output>
    </div>
    <div class="row">
      <label for="sh">어깨</label>
      <input id="sh" type="range" min="34" max="50" step="1" value="40">
      <output id="shO"></output>
    </div>
    <div class="row">
      <label for="wa">허리</label>
      <input id="wa" type="range" min="22" max="40" step="1" value="28">
      <output id="waO"></output>
    </div>
    <div class="row">
      <label for="hi">엉덩이</label>
      <input id="hi" type="range" min="30" max="50" step="1" value="37">
      <output id="hiO"></output>
    </div>

    <div class="actions">
      <button id="reset" type="button">초기화</button>
      <label class="check"><input id="spin" type="checkbox"> 자동 회전</label>
    </div>
    <p class="note" style="margin-top:10px">화면을 드래그하면 돌려 볼 수 있어요. 어깨, 허리, 엉덩이 값은 너비(cm)입니다.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var DEF = { h: 170, sh: 40, wa: 28, hi: 37 };
  var S = { h: DEF.h, sh: DEF.sh, wa: DEF.wa, hi: DEF.hi };
  var KEYS = ['h', 'sh', 'wa', 'hi'];

  // ---------- 렌더러 · 장면 ----------
  var view = document.getElementById('view');
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  view.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  var light = new THREE.DirectionalLight(0xffffff, 0.8);
  light.position.set(150, 300, 200);
  scene.add(light);
  scene.add(new THREE.GridHelper(400, 20, 0x8a94a6, 0xc5cbd6));

  var body = new THREE.Group();
  scene.add(body);
  var mat = new THREE.MeshStandardMaterial({ color: 0x8fa3bf, roughness: 0.6, metalness: 0.05 });

  function add(geo, x, y, z, parent) {
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    (parent || body).add(m);
    return m;
  }

  function clearBody() {
    while (body.children.length) {
      var c = body.children.pop();
      if (c.geometry) c.geometry.dispose();
    }
  }

  // ---------- 체형 생성 (모든 길이는 키 H 기준 비율) ----------
  function build() {
    clearBody();
    var H = S.h;
    var shR = S.sh / 2, waR = S.wa / 2, hiR = S.hi / 2;
    var neckR = 0.035 * H, armR = 0.032 * H, thighR = 0.06 * H, calfR = 0.035 * H;

    // 몸통: 높이별 반지름을 이은 회전체 (골반 → 허리 → 가슴 → 어깨 → 목)
    var profile = [
      [0, 0.46], [hiR * 0.8, 0.46], [hiR, 0.52], [hiR * 0.95, 0.55],
      [waR, 0.61], [waR * 1.12, 0.67], [shR * 0.92, 0.75], [shR, 0.81],
      [shR * 0.8, 0.84], [neckR, 0.86], [neckR * 0.9, 0.875], [0, 0.88]
    ].map(function (p) { return new THREE.Vector2(p[0], p[1] * H); });
    var torso = add(new THREE.LatheGeometry(profile, 48), 0, 0, 0);
    torso.scale.set(1, 1, 0.6); // 앞뒤 두께를 줄여 사람 몸 단면에 가깝게

    // 목, 머리
    add(new THREE.CylinderGeometry(neckR, neckR, 0.05 * H, 20), 0, 0.88 * H, 0);
    add(new THREE.SphereGeometry(0.065 * H, 32, 24), 0, 0.935 * H, 0);

    // 팔 (어깨 관절에서 바깥으로 살짝 벌림)
    [1, -1].forEach(function (side) {
      var pivot = new THREE.Group();
      pivot.position.set(side * shR * 0.92, 0.81 * H, 0);
      pivot.rotation.z = side * 0.12;
      body.add(pivot);
      add(new THREE.SphereGeometry(armR * 1.1, 16, 12), 0, 0, 0, pivot);
      add(new THREE.CylinderGeometry(armR * 1.05, armR * 0.75, 0.34 * H, 16), 0, -0.17 * H, 0, pivot);
    });

    // 다리 (고관절에서 발끝까지)
    [1, -1].forEach(function (side) {
      var pivot = new THREE.Group();
      pivot.position.set(side * hiR * 0.55, 0.47 * H, 0);
      body.add(pivot);
      add(new THREE.SphereGeometry(thighR, 16, 12), 0, 0, 0, pivot);
      add(new THREE.CylinderGeometry(thighR, calfR, 0.47 * H, 18), 0, -0.235 * H, 0, pivot);
    });
  }

  function frame() {
    var H = S.h;
    camera.position.set(0, H * 0.55, H * 2.5);
    camera.lookAt(0, H * 0.5, 0);
  }

  function resize() {
    var w = view.clientWidth, h = view.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    frame();
  }
  window.addEventListener('resize', resize);

  // ---------- 슬라이더 ----------
  function readOut(k) {
    document.getElementById(k + 'O').textContent = S[k] + (k === 'h' ? ' cm' : ' cm');
  }

  KEYS.forEach(function (k) {
    var el = document.getElementById(k);
    el.value = S[k];
    readOut(k);
    el.addEventListener('input', function () {
      S[k] = +el.value;
      readOut(k);
      build();
      frame();
    });
  });

  document.getElementById('reset').addEventListener('click', function () {
    KEYS.forEach(function (k) {
      S[k] = DEF[k];
      document.getElementById(k).value = DEF[k];
      readOut(k);
    });
    build();
    frame();
  });

  // ---------- 드래그 회전 · 자동 회전 ----------
  var rot = 0.4, dragging = false, lastX = 0;
  view.addEventListener('pointerdown', function (e) {
    dragging = true;
    lastX = e.clientX;
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    rot += (e.clientX - lastX) * 0.01;
    lastX = e.clientX;
  });
  function endDrag() { dragging = false; }
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', endDrag);

  var spin = document.getElementById('spin');

  function loop() {
    if (spin.checked && !dragging) rot += 0.008;
    body.rotation.y = rot;
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  build();
  resize();
  loop();
})();
</script>
</body>
</html>
