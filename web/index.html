<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="page-token" content="__CSRF_TOKEN__"><title>핏노트 — 내 옷장</title><link rel="stylesheet" href="/style.css"><script src="/onboarding.js" defer></script></head>
<body>
<header class="top"><a class="brand" href="/">핏노트</a><span class="tag">MY WARDROBE</span></header>
<main>
  <section class="intro"><p class="eyebrow">MY FIT</p><h1 id="wardrobe-title">잘 맞는 기준 옷 등록.</h1></section>
  <section id="saved-profile" class="input-panel saved-profile" hidden>
    <h2>내 옷장</h2><div id="saved-clothes"></div>
    <details><summary>내 옷의 실측 범위</summary><p id="saved-traits" class="hint"></p><p class="hint">신체 치수가 아닌 옷의 실측이에요.</p></details>
    <a class="primary continue-link" href="/compare">새 옷 비교 ↗</a><button id="edit-profile" type="button" class="secondary">기준 옷 수정</button>
  </section>

  <form id="profile-form" hidden>
    <!-- 방법 1: 무신사 URL 직접 입력 (최소 1벌 ~ 최대 3벌) -->
    <div class="onboarding-grid">
      <fieldset class="clothes-card"><legend><span class="number">01</span>기준 옷 (필수 1벌)</legend><label for="url-1">상품 링크</label><input id="url-1" type="url" maxlength="2048" placeholder="무신사 URL" inputmode="url"><label for="size-1">입었던 사이즈</label><input id="size-1" maxlength="80" placeholder="M / L / 100"></fieldset>
      <fieldset class="clothes-card"><legend><span class="number">02</span>기준 옷 (선택)</legend><label for="url-2">상품 링크</label><input id="url-2" type="url" maxlength="2048" placeholder="무신사 URL (비워도 됨)" inputmode="url"><label for="size-2">입었던 사이즈</label><input id="size-2" maxlength="80" placeholder="M / L / 100"></fieldset>
      <fieldset class="clothes-card"><legend><span class="number">03</span>기준 옷 (선택)</legend><label for="url-3">상품 링크</label><input id="url-3" type="url" maxlength="2048" placeholder="무신사 URL (비워도 됨)" inputmode="url"><label for="size-3">입었던 사이즈</label><input id="size-3" maxlength="80" placeholder="M / L / 100"></fieldset>
    </div>
    <div class="onboarding-bottom"><p class="hint">무신사 상의 · 최소 1벌만 입력해도 시작할 수 있어요</p><button class="primary" id="save-profile" type="submit">입력한 URL로 시작 ↗</button></div>

    <!-- 방법 2: URL 입력이 번거로울 때 대표 브랜드 상품 실측표 선택 -->
    <section class="input-panel" style="margin-top: 2rem;">
      <p class="eyebrow">URL 찾기 번거로우신가요?</p>
      <h2 style="font-size: 1.1rem; margin: 0.25rem 0;">대표 상품 실측표로 바로 시작하기</h2>
      <p class="hint" style="margin-bottom: 1rem;">평소 입어본 대표 상품과 사이즈를 선택하면, 해당 상품의 실제 실측 치수(cm)가 기준 옷으로 등록됩니다.</p>
      <div style="display: grid; gap: 0.75rem; grid-template-columns: 2fr 1fr auto; align-items: end;">
        <div>
          <label for="preset-brand">대표 브랜드 상품</label>
          <select id="preset-brand" style="width: 100%; padding: 0.6rem;">
            <option value="uniqlo_u">유니클로 U 크루넥 반팔 티셔츠 (표준 정핏)</option>
            <option value="musinsa_relax">무신사 스탠다드 릴렉스 핏 크루넥 티 (세미오버)</option>
            <option value="nike_club">나이키 클럽 플리스 크루넥 맨투맨 (여유핏·시보리)</option>
          </select>
        </div>
        <div>
          <label for="preset-size">입었던 사이즈</label>
          <select id="preset-size" style="width: 100%; padding: 0.6rem;">
            <option value="S">S</option>
            <option value="M" selected>M</option>
            <option value="L">L</option>
          </select>
        </div>
        <button type="button" id="apply-preset" class="secondary">이 실측으로 시작 ↗</button>
      </div>
    </section>
  </form>

  <p id="profile-status" class="status" role="status" aria-live="polite">옷장 확인 중…</p><p id="profile-error" class="error" role="alert" hidden></p>
  <footer><span>FIT NOTE</span><span>YOUR FIT, FOUND.</span></footer>
</main>
</body>
</html>
