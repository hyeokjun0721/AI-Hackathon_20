<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="page-token" content="__CSRF_TOKEN__"><title>핏노트 — 내 옷장</title><link rel="stylesheet" href="/style.css"><script src="/onboarding.js" defer></script></head>
<body>
<header class="top"><a class="brand" href="/">핏노트</a><span class="tag">MY WARDROBE</span></header>
<main>
  <section class="intro"><p class="eyebrow">MY FIT</p><h1 id="wardrobe-title">잘 맞는 옷 3벌.</h1></section>
  <section id="saved-profile" class="input-panel saved-profile" hidden>
    <h2>내 옷장</h2><div id="saved-clothes"></div>
    <details><summary>내 옷의 실측 범위</summary><p id="saved-traits" class="hint"></p><p class="hint">신체 치수가 아닌 옷의 실측이에요.</p></details>
    <a class="primary continue-link" href="/compare">새 옷 비교 ↗</a><button id="edit-profile" type="button" class="secondary">수정</button>
  </section>
  <form id="profile-form" hidden>
    <div class="onboarding-grid">
      <fieldset class="clothes-card"><legend><span class="number">01</span>기준 옷</legend><label for="url-1">상품 링크</label><input id="url-1" type="url" required maxlength="2048" placeholder="무신사 URL" inputmode="url"><label for="size-1">입었던 사이즈</label><input id="size-1" required maxlength="80" placeholder="M / L / 100"></fieldset>
      <fieldset class="clothes-card"><legend><span class="number">02</span>기준 옷</legend><label for="url-2">상품 링크</label><input id="url-2" type="url" required maxlength="2048" placeholder="무신사 URL" inputmode="url"><label for="size-2">입었던 사이즈</label><input id="size-2" required maxlength="80" placeholder="M / L / 100"></fieldset>
      <fieldset class="clothes-card"><legend><span class="number">03</span>기준 옷</legend><label for="url-3">상품 링크</label><input id="url-3" type="url" required maxlength="2048" placeholder="무신사 URL" inputmode="url"><label for="size-3">입었던 사이즈</label><input id="size-3" required maxlength="80" placeholder="M / L / 100"></fieldset>
    </div>
    <div class="onboarding-bottom"><p class="hint">무신사 상의 · 서로 다른 3벌 · 이 기기에 저장</p><button class="primary" id="save-profile" type="submit">저장하고 시작 ↗</button></div>
  </form>
  <p id="profile-status" class="status" role="status" aria-live="polite">옷장 확인 중…</p><p id="profile-error" class="error" role="alert" hidden></p>
  <footer><span>FIT NOTE</span><span>YOUR FIT, FOUND.</span></footer>
</main>
</body>
</html>
